# Pede a máquina do servidor à Oracle até sair vaga (servidor/criar-maquina.py).
#
# A máquina ARM gratuita de São Paulo vive sem vaga ("Out of capacity"), e a vaga que abre
# some em segundos. Cada execução pede uma vez por minuto, por pouco mais de cinco horas; o
# agendamento chama a seguinte a cada seis horas. Quando a máquina existe, o script abre as
# portas do site e pega a identidade do servidor, e este workflow avisa numa issue e desliga
# o próprio agendamento.
#
# Precisa dos segredos OCI_CONFIG e OCI_CHAVE (a chave de API da Oracle) e
# SERVIDOR_CHAVE_SSH (o mesmo da publicação). Sem eles, termina sem fazer nada. O passo a
# passo está em docs/hospedagem.md, passo 4.

name: criar máquina

on:
  workflow_dispatch:
  schedule:
    - cron: '7 */6 * * *'

permissions:
  contents: read
  issues: write
  actions: write

# Uma de cada vez: duas pedindo ao mesmo tempo poderiam criar duas máquinas.
concurrency:
  group: criar-maquina
  cancel-in-progress: false

jobs:
  criar:
    runs-on: ubuntu-latest
    # O teto do GitHub é 360. O pedido para aos 320 minutos, e o que vem depois dele —
    # esperar a máquina rodar, o IP, as portas, o SSH subir — cabe no resto.
    timeout-minutes: 358
    steps:
      - uses: actions/checkout@v4

      - name: Os segredos estão no GitHub?
        id: segredos
        env:
          OCI_CONFIG: ${{ secrets.OCI_CONFIG }}
          OCI_CHAVE: ${{ secrets.OCI_CHAVE }}
          SERVIDOR_CHAVE_SSH: ${{ secrets.SERVIDOR_CHAVE_SSH }}
        run: |
          faltam=""
          for nome in OCI_CONFIG OCI_CHAVE SERVIDOR_CHAVE_SSH; do
            [ -n "${!nome}" ] || faltam="$faltam $nome"
          done
          if [ -n "$faltam" ]; then
            echo "::notice::Faltam os segredos:$faltam. Sem eles, não há o que pedir (docs/hospedagem.md, passo 4)."
            echo "prontos=false" >> "$GITHUB_OUTPUT"
          else
            echo "prontos=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Instalar o SDK da Oracle
        if: steps.segredos.outputs.prontos == 'true'
        run: |
          python3 -m venv "$RUNNER_TEMP/oci"
          "$RUNNER_TEMP/oci/bin/pip" install --quiet --disable-pip-version-check oci==2.187.0

      - name: Pedir a máquina até sair vaga
        id: maquina
        if: steps.segredos.outputs.prontos == 'true'
        env:
          OCI_CONFIG: ${{ secrets.OCI_CONFIG }}
          OCI_CHAVE: ${{ secrets.OCI_CHAVE }}
          SERVIDOR_CHAVE_SSH: ${{ secrets.SERVIDOR_CHAVE_SSH }}
          LIMITE_MINUTOS: '320'
        run: '"$RUNNER_TEMP/oci/bin/python" servidor/criar-maquina.py'

      # A issue menciona o dono, e é isso que faz o GitHub mandar o e-mail.
      - name: Avisar e desligar o agendamento
        if: steps.maquina.outputs.criada == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RESUMO: ${{ steps.maquina.outputs.resumo }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" --title "O servidor foi criado na Oracle" --body-file "$RESUMO" ||
            echo "::warning::Não deu para abrir a issue. O resumo deste job tem o mesmo texto."
          gh workflow disable criar-maquina.yml --repo "$GITHUB_REPOSITORY"
