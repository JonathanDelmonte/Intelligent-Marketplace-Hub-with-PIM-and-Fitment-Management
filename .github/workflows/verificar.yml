name: verificar

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest

    services:
      # O schema usa pgvector, então o serviço precisa da extensão disponível.
      #
      # A versão acompanha o banco do servidor (`servidor/compose.yaml`, ADR 0010):
      # Postgres 18 com pgvector. Manter as três iguais — servidor, CI e o
      # `compose.yaml` de quem desenvolve — é o que evita "passa aqui e falha lá", e
      # vale mais que ficar numa versão antiga por precaução.
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: bancada
          POSTGRES_PASSWORD: bancada
          POSTGRES_DB: bancada
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://bancada:bancada@localhost:5432/bancada
      # A suíte trunca tabelas, então lê uma variável própria — nunca a da
      # aplicação. No CI o banco é do contêiner e é descartado com ele, então as
      # duas apontam para o mesmo serviço; fora do CI têm de ser bancos diferentes,
      # e `abrirBancoDeTeste` recusa se forem iguais. Daí o nome de banco distinto.
      DATABASE_URL_TESTE: postgres://bancada:bancada@localhost:5432/bancada_teste
      BANCADA_PERFIL_PADRAO: perfil-de-ci

    steps:
      - uses: actions/checkout@v4
        with:
          # Histórico completo para a conferência de autoria alcançar todo commit.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Autoria dos commits
        run: npm run verify:authors

      - name: Caractere literal em fonte
        run: npm run verify:fontes

      - name: Tipos
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Formatação
        run: npm run format:check

      # As migrations vêm ANTES dos testes: parte da suíte roda contra o banco de
      # verdade, e sem as tabelas ela seria pulada em silêncio — o CI passaria
      # sem ter exercitado idempotência, SKIP LOCKED nem isolamento de perfil.
      - name: Chave mestra de cifragem (descartável, só para o CI)
        run: echo "CREDENCIAL_CHAVE_MESTRA=$(node -e "console.log(require('crypto').randomBytes(32).toString('base64'))")" >> "$GITHUB_ENV"

      - name: Migrations contra Postgres real
        run: npm run db:migrate

      # O banco da suíte é outro, e precisa existir e ter schema. Criar aqui, e não
      # no serviço, porque o serviço só aceita um `POSTGRES_DB`.
      - name: Banco descartável da suíte
        run: |
          PGPASSWORD=bancada createdb -h localhost -U bancada bancada_teste
          DATABASE_URL="$DATABASE_URL_TESTE" npm run db:migrate

      - name: Testes
        run: npm run test

      - name: Seed do primeiro perfil
        run: npm run db:seed -- --nome="Perfil de CI" --regime=cpf

      - name: Build
        run: npm run build

  # A imagem de produção (ADR 0010), montada a cada push, em paralelo com a
  # verificação: um Dockerfile quebrado aparece no push que o quebrou, e não na
  # publicação. O repositório é público, e minuto de GitHub Actions em repositório
  # público não é cobrado.
  imagem:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Montar a imagem
        run: docker build --progress=plain --build-arg VERSAO="$GITHUB_SHA" -t hub:ci .

      # Sem banco de propósito: o que se confere é que a imagem sobe, que a
      # configuração chega pelo ambiente e que o porteiro está no build. A saúde
      # tem de dizer "sem banco" (503), a tela de entrar abre, e o resto manda
      # para ela.
      - name: A imagem sobe e responde
        run: |
          docker run -d --name hub-ci -p 3000:3000 \
            -e DATABASE_URL=postgres://ninguem:nada@127.0.0.1:1/nada \
            -e CREDENCIAL_CHAVE_MESTRA="$(openssl rand -base64 32)" \
            -e BANCADA_PERFIL_PADRAO=ci \
            hub:ci
          for _ in $(seq 1 60); do
            saude=$(curl -s -o saude.json -w '%{http_code}' http://127.0.0.1:3000/saude || true)
            [ "$saude" = 503 ] && break
            sleep 1
          done
          entrar=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/entrar)
          catalogo=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/catalogo)
          echo "saude=$saude $(cat saude.json) entrar=$entrar catalogo=$catalogo"
          docker logs hub-ci 2>&1 | tail -20
          test "$saude" = 503
          grep -q '"sem banco"' saude.json
          grep -q "\"$GITHUB_SHA\"" saude.json
          test "$entrar" = 200
          test "$catalogo" = 307
