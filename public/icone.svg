<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Bancada">
  <!--
    Ícone provisório: barras de código de barras. Sem nome e sem cor de marca
    dentro do desenho — a cor vem de `currentColor` onde o navegador permitir, e o
    dia de ter logo de verdade troca este arquivo. Ver ADR 0003.
  -->
  <rect width="64" height="64" rx="12" fill="#1d4ed8" />
  <g fill="#ffffff">
    <rect x="14" y="16" width="4" height="32" />
    <rect x="22" y="16" width="2" height="32" />
    <rect x="28" y="16" width="5" height="32" />
    <rect x="37" y="16" width="2" height="32" />
    <rect x="43" y="16" width="3" height="32" />
    <rect x="50" y="16" width="2" height="32" />
  </g>
</svg>
